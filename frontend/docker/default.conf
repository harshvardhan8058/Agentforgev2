# Frontend_Image SPA server (deployment Req 2.3, 2.4, 8.x).
#
# Serves the compiled Vite/React single-page application as static assets, with a
# history-API fallback so client-side routes resolve to index.html, a /healthz
# liveness endpoint, and a never-cached runtime /config.js (rendered at container
# start by the entrypoint from API_BASE_URL). Listens on 8080 so the container runs
# fully non-root (uid 101) — the runtime maps the published host port to 8080.
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Serving-status endpoint (Health_Check target); returns 200 while nginx serves.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Runtime_Config: regenerated on every container start, so it must never be
    # cached by the browser (build-once / run-anywhere per environment, Req 8.3).
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files /config.js =404;
    }

    # The app entry point must not be cached so a new deploy is picked up promptly;
    # hashed assets under /assets/ are immutable and cache well.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths return the app entry point (Req 2.3).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
