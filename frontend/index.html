<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentForge</title>
    <!--
      No-flash-of-wrong-theme (FOWT) bootstrap. It is an external same-origin
      script so the gateway's strict `script-src 'self'` CSP permits it.
    -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Runtime_Config (deployment Req 8.1-8.4). The image entrypoint overwrites
      the public placeholder at /config.js from API_BASE_URL. Loading it as an
      external classic script is parser-blocking (so it runs before the module)
      and is permitted by the gateway's strict `script-src 'self'` CSP.
    -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
