<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentForge</title>
    <!--
      No-flash-of-wrong-theme (FOWT) pre-paint script.
      Resolves and applies the theme on <html> before first paint / React
      hydration, reading the same non-secret 'agentforge.theme' localStorage key
      and prefers-color-scheme media query that ThemeProvider/useTheme use, so
      React adopts the already-applied theme with no light->dark repaint.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('agentforge.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
