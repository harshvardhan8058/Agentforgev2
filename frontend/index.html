<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentForge</title>
    <!--
      No-flash-of-wrong-theme (FOWT) pre-paint script.
      Resolves and applies the theme on <html> before first paint / React
      hydration, reading the same non-secret 'agentforge.theme' localStorage key
      and prefers-color-scheme media query that ThemeProvider/useTheme use, so
      React adopts the already-applied theme with no light->dark repaint.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('agentforge.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Runtime_Config (deployment Req 8.1-8.4). In a deployed Frontend_Image the
      container entrypoint renders /config.js from API_BASE_URL, setting
      window.__AGENTFORGE_CONFIG__ before the app module runs (classic scripts
      execute before deferred module scripts). In Vite dev this file is absent and
      is simply skipped, so resolveConfig() falls back to the build-time value /
      documented default and dev is unaffected.
    -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
