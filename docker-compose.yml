# AgentForge — unified one-command KEYLESS local stack (Phase 9, Req 4.x, 11.x, 12.x, 20.x).
#
# Brings up the FULL platform behind a single nginx entry point with ZERO credentials:
#
#     docker compose up --build
#
# Services:
#   nginx     Reverse_Proxy — the ONLY published service (host 80 -> container 8080).
#             Routes / -> frontend and the API prefixes (+ SSE) -> api.
#   frontend  Frontend_Image (static SPA + runtime /config.js), non-root, listens 8080.
#   api       Backend_Image (uvicorn agentforge.main:app), non-root, listens 8000.
#   postgres  pgvector/pgvector:pg16 (bundled keyless default creds agentforge/agentforge).
#   redis     redis:7-alpine.
#
# Everything except nginx is internal to the compose network; the browser reaches both
# the SPA and the API same-origin through http://localhost. No credential is required or
# committed (PROFILE=local is keyless).

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: agentforge-nginx
    # The SOLE published entry point: host :80 -> non-root container :8080 (Req 6.4).
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # busybox wget ships in the alpine nginx image; /healthz returns 200 when serving.
      # Use 127.0.0.1 (not localhost) so the probe hits nginx's IPv4 listener, not ::1.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentforge-frontend
    environment:
      # Runtime_Config: the browser reaches the API SAME-ORIGIN through the nginx proxy,
      # so config.js is rendered with "/". The client resolves that marker to the page's
      # absolute origin before openapi-fetch constructs a Request, so the app works via
      # localhost, 127.0.0.1, a LAN IP, or a domain — with no CORS and no dependence on
      # the API port (:8000 is intentionally NOT published in this stack). Hardcoding a
      # single host here is the bug that surfaces as "Unable to reach the server" the
      # moment the app is opened from any other origin. Override with a full
      # scheme://host only when the API lives on a SEPARATE origin, which additionally
      # requires matching gateway `connect-src` and API CORS policies (Req 8.4; see
      # docs/DEPLOYMENT.md).
      API_BASE_URL: ${API_BASE_URL:-/}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentforge-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Keyless local profile — NO credentials (Req 4.2, 20.2).
      PROFILE: ${PROFILE:-local}
      API_PORT: ${API_PORT:-8000}
      # Bundled non-secret infrastructure DSNs pointing at the compose services (Req 4.5).
      DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      # Persist the ten Domain_Stores to the already-running Postgres over the non-secret
      # DSN above, so the default keyless local stack survives `docker compose restart`
      # (B1, Req 1.2). This adds NO credential — it only flips store selection to the
      # DB-backed Pg_* implementations via Settings.persist_domain_stores(). Override to
      # "false" to keep the (ephemeral) in-memory stores.
      USE_DATABASE: ${USE_DATABASE:-true}
      # Local convenience: when retrieval finds nothing, answer from the model's
      # general knowledge instead of refusing, so the assistant is useful before the
      # corpus is populated. Such answers are always reported as ungrounded with no
      # citations. Set to "false" to enforce document-backed answers only.
      ALLOW_UNGROUNDED_ANSWERS: ${ALLOW_UNGROUNDED_ANSWERS:-true}
      # Work budgets. The code-level defaults (10 agent iterations, 6 rounds,
      # 3 revisions) are worst-case safety ceilings, not sensible interactive values:
      # a multi-agent run nests them, so 4 roles x up to 11 completions x several
      # rounds is well over a hundred sequential LLM calls for ONE synchronous request.
      # With a real provider that takes many minutes and looks like a hang. These
      # local values keep an interactive run to a handful of calls per role; raise them
      # for batch/offline work.
      ITERATION_LIMIT: ${ITERATION_LIMIT:-4}
      MAX_ROUNDS: ${MAX_ROUNDS:-2}
      MAX_REVISIONS: ${MAX_REVISIONS:-1}
      # Bound every hosted-LLM call so one stalled request cannot hang the run.
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      # Free hosted tiers meter tokens per minute and one multi-role run can exhaust
      # that on its own. The limit clears in seconds, so wait it out (bounded) instead
      # of killing the run; raise this if you see rate-limit errors mid-run.
      LLM_RATE_LIMIT_MAX_WAIT_SECONDS: ${LLM_RATE_LIMIT_MAX_WAIT_SECONDS:-8}
      # Per-principal rate limiting is Redis-backed; keep it OFF for the local single-user
      # keyless stack (the documented keyless default). Override to "true" to exercise it.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      # Optional provider keys stay blank locally (keyless-safe fallbacks).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HOSTED_EMBEDDING_API_KEY: ${HOSTED_EMBEDDING_API_KEY:-}
    healthcheck:
      # Slim python image lacks curl; use the stdlib urllib probe against /health/live.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous start_period covers on-startup migrations + dependency warm-up (Req 12).
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentforge-postgres
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
      POSTGRES_DB: agentforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge -d agentforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: agentforge-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
