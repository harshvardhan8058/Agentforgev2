# AgentForge Reverse_Proxy — TLS server (deployment Req 7.1, 7.2, security headers).
#
# PRODUCTION ONLY. This file is NOT auto-loaded by the default image so that a
# keyless local `nginx -t` passes without any certificate material. To enable HTTPS
# in production, mount this file into /etc/nginx/conf.d/ AND mount the certificate
# and key read-only at the paths below (never bake certs into an image):
#
#   -v ./nginx/tls/agentforge-tls.conf:/etc/nginx/conf.d/agentforge-tls.conf:ro
#   -v /path/to/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
#   -v /path/to/privkey.pem:/etc/nginx/tls/privkey.pem:ro
#
# Listens on 8443 (non-root); the runtime publishes host :443.

server {
    listen      8443 ssl;
    http2       on;
    server_name _;

    # Certificate material mounted at runtime from a Secret_Source (Req 7.2).
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    client_max_body_size 25m;

    # Hardened security headers (additive metadata only — bodies unchanged).
    include /etc/nginx/snippets/security_headers.conf;

    # HSTS: emitted ONLY here (TLS/443), never from the plain-HTTP server. One year
    # + subdomains; `preload` is left opt-in for operators who have submitted the
    # domain to the preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Same routing as the HTTP server: frontend by default, backend prefixes to API.
    include /etc/nginx/snippets/locations.conf;
}

# Optional HTTP->HTTPS redirect for production. To use it, DISABLE the plain-HTTP
# server in conf.d/agentforge.conf (which also listens on 8080) to avoid a duplicate
# listen, then uncomment this block:
#
# server {
#     listen      8080;
#     server_name _;
#     return 301  https://$host$request_uri;
# }
