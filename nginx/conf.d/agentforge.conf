# AgentForge Reverse_Proxy — HTTP server (deployment Req 6.x, 7.4).
#
# Plain-HTTP entry point so One_Command_Startup works locally with no certificate
# material (Req 7.4). Listens on 8080 (non-root); the runtime publishes host :80.
# In production the TLS server (tls/agentforge-tls.conf) is enabled alongside this
# block; HSTS is emitted only from that TLS block, never from here.
server {
    listen      8080;
    server_name _;

    # Hardened security headers (additive metadata only — bodies unchanged).
    # NOTE: HSTS is deliberately absent on plain HTTP; it lives in the TLS block.
    include /etc/nginx/snippets/security_headers.conf;

    # Do not leak the proxy's nginx version.
    server_tokens off;

    # Allow reasonably large uploads (document ingest) without altering bodies.
    client_max_body_size 25m;

    # Routing: frontend by default, concrete backend prefixes to the API (+ SSE).
    include /etc/nginx/snippets/locations.conf;
}
