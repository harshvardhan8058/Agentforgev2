# Backend proxy behavior (deployment Req 6.2, 6.3). Applied to every backend route
# prefix. SSE-safe by default: buffering and caching are disabled and the read
# timeout is raised so Server-Sent Events stream to the client unbuffered, while
# ordinary JSON responses are unaffected. The backend's X-Accel-Buffering: no header
# is honored automatically because proxy_buffering is off.
include /etc/nginx/snippets/proxy_headers.conf;

# HTTP/1.1 to the upstream is REQUIRED for chunked streaming + upstream keepalive.
# It is set once by the shared proxy_headers.conf included above; declaring it again
# in this location makes nginx reject the configuration as a duplicate directive.

# Reuse upstream keepalive connections (paired with the shared HTTP/1.1 setting).
proxy_set_header Connection "";

# Explicitly disable proxy response buffering for SSE (honored alongside proxy_buffering
# off). Non-streaming JSON responses remain byte-identical — disabling buffering never
# alters the response body, it only forwards it without holding it.
proxy_set_header X-Accel-Buffering no;

# Stream events immediately — do not buffer or cache the response.
proxy_buffering  off;
proxy_cache      off;

# Allow long-lived streaming connections (SSE) without premature timeout.
proxy_read_timeout  3600s;
proxy_send_timeout  3600s;
