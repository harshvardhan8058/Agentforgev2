# Shared routing (deployment Req 6.1, 6.2, 6.4). Included by both the HTTP and TLS
# server blocks so routing is identical regardless of transport.
#
# location /               -> Frontend_Client static assets (SPA)
# concrete backend prefixes -> Backend_Service (API + SSE), bodies unchanged
#
# The backend prefixes are exactly the routers mounted by agentforge.main; any path
# not matching a backend prefix falls through to the frontend.

# Reverse_Proxy self health (serving status); returns 200 when the proxy is up.
location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}

# ---- Backend_Service route prefixes (API + SSE) ----
location /health {
    proxy_pass http://backend_upstream;
    include /etc/nginx/snippets/proxy_backend.conf;
}
location /auth {
    proxy_pass http://backend_upstream;
    include /etc/nginx/snippets/proxy_backend.conf;
}
location /orgs {
    proxy_pass http://backend_upstream;
    include /etc/nginx/snippets/proxy_backend.conf;
}
location /agent {
    proxy_pass http://backend_upstream;
    include /etc/nginx/snippets/proxy_backend.conf;
}
location /query {
    proxy_pass http://backend_upstream;
    include /etc/nginx/snippets/proxy_backend.conf;
}
location /ingest {
    proxy_pass http://backend_upstream;
    include /etc/nginx/snippets/proxy_backend.conf;
}
location /documents {
    proxy_pass http://backend_upstream;
    include /etc/nginx/snippets/proxy_backend.conf;
}
location /conversations {
    proxy_pass http://backend_upstream;
    include /etc/nginx/snippets/proxy_backend.conf;
}
location /multi-agent {
    proxy_pass http://backend_upstream;
    include /etc/nginx/snippets/proxy_backend.conf;
