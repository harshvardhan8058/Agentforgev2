# Hardened response security headers (deployment Req 6.5, 7.1, security-header design).
#
# These are additive response metadata only — they never alter the response body, so
# the HTTP/SSE contract and the AppError envelope stay byte-preserved. `always`
# ensures the headers are emitted on error responses too. HSTS is intentionally NOT
# here: it is emitted ONLY from the TLS/443 server block (never plain HTTP), where it
# is added directly.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content-Security-Policy: tunable default that still permits the hashed bundle, the
# runtime /config.js (same-origin script), same-origin XHR/fetch/SSE to the backend,
# inline styles emitted by the Vite/Tailwind toolchain, and data: images. Tighten
# style-src to hashes/nonces if the shipped bundle permits.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
