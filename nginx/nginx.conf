# AgentForge Reverse_Proxy — main nginx config (deployment Req 6.x, 7.x, 1.3).
#
# The reverse proxy is the SOLE external entry point for the Platform. It runs fully
# non-root (nginxinc/nginx-unprivileged, uid 101): the pid file and all temp paths
# live under writable locations and the servers listen on non-privileged ports
# (8080 HTTP / 8443 TLS), which the container runtime publishes as host 80/443.

worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Non-root writable temp paths (uid 101 cannot write the default /var/cache dirs).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # Upstreams on the internal Docker network (service names resolve in Compose).
    # Referenced by both the HTTP (conf.d/agentforge.conf) and TLS server blocks.
    upstream frontend_upstream {
        server frontend:8080;
        keepalive 16;
    }
    upstream backend_upstream {
        server api:8000;
        keepalive 32;
    }

    # HTTP server (always on). The TLS server (tls/agentforge-tls.conf) is enabled in
    # production by mounting it into conf.d together with the certificate material.
    include /etc/nginx/conf.d/*.conf;
}
